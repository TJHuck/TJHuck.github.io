<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Writing by Terry Huck about design, development, and the web.">
	<title>Post - Terry Huck</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="writing.css">
</head>
<body>
	<header>
		<div class="wrap">
			<nav>
				<a class="logo" href="index.html">TJ<span>.</span></a>
				<div class="links">
					<a href="index.html#work">Work</a>
					<a href="writing.html">Writing</a>
					<a href="index.html#about">About</a>
					<a href="mailto:tjhuck821@gmail.com">Contact ↗</a>
				</div>
			</nav>
		</div>
	</header>
	<main>
		<section class="writing-intro">
			<div class="wrap writing-list" id="post-content"></div>
		</section>
	</main>
	<footer class="wrap">
		<div>© 2026 Terry Huck.</div>
		<div class="social">
			<a href="https://github.com/TJHuck">GitHub</a>
			<a href="https://www.linkedin.com/terry-huck">LinkedIn</a>
			<a href="mailto:tjhuck821@gmail.com">Email</a>
		</div>
	</footer>
	<script src="posts.js"></script>
	<script>
		const slug = new URLSearchParams(window.location.search).get("slug");
		const post = BLOG_POSTS.find((candidate) => candidate.slug === slug);
		const content = document.querySelector("#post-content");

		if (post) {
			document.title = `${post.title} - Terry Huck`;
			content.innerHTML = renderFullPost(post);
		} else {
			content.innerHTML = `
				<article class="full-post">
					<h2>Post not found</h2>
					<p>This post may have moved. Return to the writing page to browse all posts.</p>
					<a class="back-link" href="writing.html">← All posts</a>
				</article>`;
		}
	</script>
</body>
</html>
